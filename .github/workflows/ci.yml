name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  actions: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.CI_TOKEN }}
  NODE_VERSION: 20

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout full history (NX affected needs this)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node + pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Commitlint (fail fast)
      - name: Lint commit message
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

      # Prisma generate (safe)
      - name: Prisma generate
        run: pnpm exec prisma generate --schema=classroom-api/prisma/schema.prisma

      # NX affected for PR
      - name: Nx affected (PR)
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec nx affected \
            -t lint test build \
            --base=origin/${{ github.base_ref }} \
            --head=HEAD

      # NX full run for main/develop
      - name: Nx run-many (main/develop)
        if: github.event_name == 'push'
        run: |
          pnpm exec nx run-many \
            -t lint test build \
            --all

      # Optional: Prisma migrate (ONLY main)
      - name: Prisma migrate deploy
        if: github.ref == 'refs/heads/main'
        run: pnpm exec prisma migrate deploy

      # NX Cloud self-heal
      - name: Nx fix CI
        if: always()
        run: pnpm exec nx fix-ci
