name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
      - feature/*

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.8.0
          run_install: false

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: pnpm dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Prisma generate
      - name: Prisma generate
        run: pnpm exec prisma generate

      # Commit message lint
      - name: lint commit message
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

      # Nx affected for PR
      - name: Run affected tasks (PR)
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec nx affected \
            -t lint test build \
            --base=origin/main \
            --head=HEAD

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: pnpm exec nx-cloud record -- echo Hello World
      - run: pnpm exec nx run-many -t lint test build

      # Handle Prisma $connect/$disconnect methods if needed (fix PrismaService issues)
      - name: Run Prisma Database Migrations (Optional)
        run: |
          pnpm exec prisma migrate deploy
        if: github.event_name == 'push'

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()
