name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.CI_TOKEN }}
  NODE_VERSION: 22

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit message
        uses: wagoid/commitlint-github-action@v6

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Nx affected
        run: |
          pnpm exec nx affected \
            -t lint test build \
            --base=origin/${{ github.base_ref }} \
            --head=HEAD

      - name: Nx fix CI
        if: always()
        run: pnpm exec nx fix-ci

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: audit dependencies
        run: pnpm audit --prod

      - name: trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          severity: 'CRITICAL, HIGH'
          exit-code: '1'
          format: 'table'
          needs: verify
